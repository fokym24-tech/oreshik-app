.side{width:100%;display:flex;flex-direction:column;background:var(--bg)}
.main{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--chat);transform:translateX(100%);transition:transform .25s}
#app.open .main{transform:none}
@media(min-width:760px){.side{width:340px;flex:none;border-right:1px solid var(--line)}.main{position:static;transform:none;flex:1}.back{display:none!important}}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--head);color:#fff;min-height:56px}
header h1{font-size:19px;font-weight:600;flex:1;min-width:0}header h1 small{display:block;font-size:12px;font-weight:400;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .t{flex:1;min-width:0}header .t b{display:block}header .t small{opacity:.75;font-size:13px}
.logo{width:36px;height:36px;border-radius:9px;flex:none}
.ib{background:none;border:0;color:inherit;font-size:21px;padding:6px 8px;border-radius:50%;cursor:pointer}
.search{padding:8px 12px}.search input{width:100%;border:0;background:var(--hover);color:var(--text);padding:10px 16px;border-radius:22px;font-size:15px;outline:0}
.list{flex:1;overflow-y:auto}
.chat{display:flex;gap:12px;padding:10px 14px;cursor:pointer;align-items:center}.chat:hover,.chat.sel{background:var(--hover)}
.av{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;font-size:20px}.sm{width:40px;height:40px;font-size:16px}
.ci{flex:1;min-width:0}.row{display:flex;justify-content:space-between;gap:8px}
.row b,.prev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{color:var(--sub);font-size:12.5px;flex:none}
.prev{color:var(--sub);font-size:14.5px}.dot{background:var(--acc);border-radius:50%;width:12px;height:12px;flex:none;align-self:center}
.fab{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:22px;box-shadow:0 3px 10px #0004;cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:4px}
.m{max-width:80%;padding:6px 10px 4px;border-radius:14px;background:var(--in);word-wrap:break-word;white-space:pre-wrap;box-shadow:0 1px 1px #0002}
.m.me{align-self:flex-end;background:var(--out);border-bottom-right-radius:4px}.m.th{align-self:flex-start;border-bottom-left-radius:4px}
.m i{display:block;text-align:right;font-style:normal;font-size:11.5px;color:var(--sub)}
.empty{margin:auto;color:#fff;background:#0004;padding:4px 14px;border-radius:14px;font-size:14px;text-align:center}
.bar{display:flex;align-items:flex-end;gap:6px;padding:8px;background:var(--bg)}
.bar textarea{flex:1;resize:none;border:0;outline:0;background:var(--hover);color:var(--text);border-radius:20px;padding:10px 14px;font:16px/1.3 inherit;max-height:120px}
.send{background:var(--acc);color:#fff;border:0;width:42px;height:42px;border-radius:50%;font-size:19px;cursor:pointer;flex:none}
.scr{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.card{width:100%;max-width:360px;text-align:center}.card img{width:96px;height:96px;border-radius:24px;margin-bottom:10px}
.card h2{font-size:24px;margin-bottom:4px}.card p{color:var(--sub);font-size:14.5px;margin-bottom:16px}
.card input{display:block;width:100%;border:1px solid var(--line);background:var(--hover);color:var(--text);border-radius:12px;padding:13px 14px;font-size:16px;margin-bottom:10px;outline:0}
.card input:focus{border-color:var(--acc)}
.go{width:100%;border:0;background:var(--acc);color:#fff;font-size:16px;font-weight:600;padding:13px;border-radius:12px;cursor:pointer;margin-top:4px}
.lnk{background:none;border:0;color:var(--acc);font-size:15px;margin-top:12px;cursor:pointer;display:block;width:100%}
.err{color:#e5484d;font-size:14px;min-height:20px;margin-bottom:4px}
</style></head><body>

<div id="setup" class="scr hide"><div class="card"><h2>Нужна настройка</h2><p>Откройте файл в редакторе и вставьте данные своего проекта Firebase в <b>firebaseConfig</b> (инструкция есть в чате).</p></div></div>

  apiKey: "AIzaSyAqaX0l9TSKXnqFE3FQYjdFbE8AOfypLmA",
  authDomain: "oreshik.firebaseapp.com",
  projectId: "oreshik",
  storageBucket: "oreshik.firebasestorage.app",
  messagingSenderId: "821352083205",
  appId: "1:821352083205:web:c6e663ab0490c666e2916c"
};
/* ======================================================= */
const $=i=>document.getElementById(i);
if(firebaseConfig.apiKey.startsWith("ВСТАВЬТЕ")){$("setup").classList.remove("hide")}
else{
const V="10.14.1",G="https://www.gstatic.com/firebasejs/"+V+"/";
const {initializeApp}=await import(G+"firebase-app.js");
const A=await import(G+"firebase-auth.js");
const F=await import(G+"firebase-firestore.js");
const app=initializeApp(firebaseConfig),auth=A.getAuth(app),db=F.getFirestore(app);
const COL=["#e17076","#7bc862","#e5ca77","#65aadd","#a695e7","#ee7aae","#6ec9cb","#faa774"];
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const tm=d=>{const x=new Date(d);return("0"+x.getHours()).slice(-2)+":"+("0"+x.getMinutes()).slice(-2)};
const dl=d=>new Date(d).toDateString()==new Date().toDateString()?tm(d):new Date(d).getDate()+"."+("0"+(new Date(d).getMonth()+1)).slice(-2);
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return COL[h%COL.length]};
const ERR={"auth/email-already-in-use":"Эта почта уже зарегистрирована","auth/invalid-credential":"Неверная почта или пароль","auth/invalid-email":"Некорректная почта","auth/weak-password":"Слишком простой пароль","auth/too-many-requests":"Слишком много попыток, попробуйте позже","auth/network-request-failed":"Нет связи с сетью","auth/user-not-found":"Аккаунт не найден"};
const et=e=>ERR[e.code]||("Ошибка: "+(e.code||e.message));
let reg=false,me=null,chats=[],cur=null,unM=null,unC=null;
const show=id=>{["auth","verify"].forEach(x=>$(x).classList.toggle("hide",x!=id))};

function mode(r){reg=r;$("at").textContent=r?"Регистрация":"Вход";$("as").textContent=r?"Создайте аккаунт по электронной почте":"Войдите в свой аккаунт";
 $("an").classList.toggle("hide",!r);$("ago").textContent=r?"Зарегистрироваться":"Войти";
 $("atg").textContent=r?"Уже есть аккаунт? Войти":"Нет аккаунта? Зарегистрироваться";
 $("areset").classList.toggle("hide",r);$("ap").autocomplete=r?"new-password":"current-password";$("aerr").textContent=""}
$("atg").onclick=()=>mode(!reg);
$("af").onsubmit=async e=>{
 e.preventDefault();const em=$("ae").value.trim(),pw=$("ap").value,nm=$("an").value.trim(),er=$("aerr");er.textContent="";
 try{
  if(reg){
   if(!nm){er.textContent="Введите имя";return}
   if(pw.length<8){er.textContent="Пароль — минимум 8 символов";return}
   const c=await A.createUserWithEmailAndPassword(auth,em,pw);
   await A.updateProfile(c.user,{displayName:nm});
   await F.setDoc(F.doc(db,"users",c.user.uid),{name:nm,email:em,emailLower:em.toLowerCase()});
   await A.sendEmailVerification(c.user);
   await gate(c.user);
  }else await A.signInWithEmailAndPassword(auth,em,pw);
 }catch(x){er.textContent=et(x)}
};
$("areset").onclick=async()=>{const em=$("ae").value.trim();if(!em){$("aerr").textContent="Введите почту выше";return}
 try{await A.sendPasswordResetEmail(auth,em);$("aerr").textContent="Письмо для сброса пароля отправлено"}catch(x){$("aerr").textContent=et(x)}};
$("vok").onclick=async()=>{await auth.currentUser.reload();$("verr").textContent="";if(auth.currentUser.emailVerified)gate(auth.currentUser);else $("verr").textContent="Почта ещё не подтверждена"};
$("vre").onclick=async()=>{try{await A.sendEmailVerification(auth.currentUser);$("verr").textContent="Письмо отправлено"}catch(x){$("verr").textContent=et(x)}};
$("vout").onclick=$("out").onclick=()=>A.signOut(auth);

async function gate(u){
 if(!u.emailVerified){$("vp").textContent="Мы отправили письмо на "+u.email+". Откройте его, нажмите на ссылку и вернитесь сюда.";show("verify");return}
 me=u;show(null);start();
}
A.onAuthStateChanged(auth,u=>{
 if(!u){me=null;stop();show("auth");mode(false);$("ap").value="";return}
 gate(u);
});
function stop(){if(unC)unC();if(unM)unM();unC=unM=null;chats=[];cur=null;$("app").classList.remove("open")}

async function start(){
 $("me").textContent=(me.displayName||"")+" · "+me.email;
 await F.setDoc(F.doc(db,"users",me.uid),{name:me.displayName||me.email,email:me.email,emailLower:me.email.toLowerCase()},{merge:true});
 if(unC)unC();
 unC=F.onSnapshot(F.query(F.collection(db,"chats"),F.where("members","array-contains",me.uid)),s=>{
  chats=s.docs.map(d=>({id:d.id,...d.data()}));renderList();
  if(cur){const c=chats.find(x=>x.id==cur);if(c)head(c)}
 });
}
const peer=c=>{const o=c.members.find(x=>x!=me.uid);return{uid:o,name:(c.names&&c.names[o])||"Друг",email:(c.emails&&c.emails[o])||""}};
const seenKey=id=>"oreshik_seen_"+id;
const seen=id=>{try{return +localStorage.getItem(seenKey(id))||0}catch(e){return 0}};
const mark=(id,t)=>{try{localStorage.setItem(seenKey(id),t)}catch(e){}};
function renderList(){
 const q=$("q").value.toLowerCase();
 const a=chats.filter(c=>peer(c).name.toLowerCase().includes(q)).sort((x,y)=>(y.lastAt||y.createdAt||0)-(x.lastAt||x.createdAt||0));
 $("list").innerHTML=a.map(c=>{const p=peer(c),un=c.lastFrom&&c.lastFrom!=me.uid&&(c.lastAt||0)>seen(c.id)&&c.id!=cur;
  return '<div class="chat'+(c.id==cur?" sel":"")+'" data-id="'+c.id+'"><div class="av" style="background:'+hue(p.uid)+'">'+esc(p.name.charAt(0).toUpperCase())+'</div><div class="ci"><div class="row"><b>'+esc(p.name)+'</b><small>'+(c.lastAt?dl(c.lastAt):"")+'</small></div><div class="row"><div class="prev">'+(c.lastText?(c.lastFrom==me.uid?"Вы: ":"")+esc(c.lastText):"Напишите первым")+'</div>'+(un?'<span class="dot"></span>':"")+'</div></div></div>'}).join("")
  ||'<div style="padding:24px;color:var(--sub);text-align:center">Друзей пока нет.<br>Нажмите ＋ и введите почту друга.</div>';
}
function head(c){const p=peer(c);$("hn").textContent=p.name;$("hs").textContent=p.email;$("hav").style.background=hue(p.uid);$("hav").textContent=p.name.charAt(0).toUpperCase()}
function open(id){
 cur=id;const c=chats.find(x=>x.id==id);head(c);$("app").classList.add("open");mark(id,c.lastAt||0);renderList();
 if(unM)unM();
 unM=F.onSnapshot(F.query(F.collection(db,"chats",id,"messages"),F.orderBy("at"),F.limit(300)),s=>{
  const h=s.docs.map(d=>d.data()).map(m=>'<div class="m '+(m.from==me.uid?"me":"th")+'">'+esc(m.text)+'<i>'+tm(m.at)+'</i></div>').join("");
  $("msgs").innerHTML=h||'<div class="empty">Сообщений пока нет</div>';$("msgs").scrollTop=1e9;
  const l=s.docs.length&&s.docs[s.docs.length-1].data();if(l)mark(id,l.at);
 });
}
$("list").onclick=e=>{const el=e.target.closest(".chat");if(el)open(el.dataset.id)};
$("q").oninput=renderList;
$("back").onclick=()=>{$("app").classList.remove("open");cur=null;if(unM)unM();unM=null;renderList()};
$("add").onclick=async()=>{
 let em=prompt("Почта друга (он должен быть зарегистрирован в Oreshik):");if(!em)return;em=em.trim().toLowerCase();
 if(em==me.email.toLowerCase()){alert("Это ваша почта");return}
 try{
  const s=await F.getDocs(F.query(F.collection(db,"users"),F.where("emailLower","==",em),F.limit(1)));
  if(s.empty){alert("Пользователь не найден. Друг должен сначала зарегистрироваться в Oreshik.");return}
  const f=s.docs[0],fu=f.data(),id=[me.uid,f.id].sort().join("_");
  await F.setDoc(F.doc(db,"chats",id),{members:[me.uid,f.id],names:{[me.uid]:me.displayName||me.email,[f.id]:fu.name},emails:{[me.uid]:me.email,[f.id]:fu.email},createdAt:Date.now()},{merge:true});
  setTimeout(()=>open(id),400);
 }catch(x){alert("Не удалось добавить: "+(x.code||x.message))}
};
async function send(){
 const t=$("in").value.trim();if(!t||!cur)return;$("in").value="";$("in").style.height="auto";const at=Date.now();
 try{
  await F.addDoc(F.collection(db,"chats",cur,"messages"),{from:me.uid,text:t,at});
  await F.updateDoc(F.doc(db,"chats",cur),{lastText:t.slice(0,200),lastAt:at,lastFrom:me.uid});
 }catch(x){alert("Не отправлено: "+(x.code||x.message));$("in").value=t}
}
$("send").onclick=send;
$("in").addEventListener("keydown",e=>{if(e.key=="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("in").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,120)+"px"});
}
</script></body></html>
